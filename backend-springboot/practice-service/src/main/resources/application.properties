server.port=9093
spring.application.name=practice-service

# Shared database (phase-12 step-1 topology). This service OWNS
# `interaction_logs` and runtime-writes `exercises`.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mathwise_db}
spring.datasource.username=${DB_USER:db_user}
spring.datasource.password=${DB_PASSWORD:0}
spring.jpa.hibernate.ddl-auto=update

# Verification-only here — tokens are issued by auth-service with the same secret.
jwt.secret=${JWT_SECRET:DEV_ONLY_PLACEHOLDER_REPLACE_VIA_JWT_SECRET_ENV_VAR}

# The FastAPI AI service — this is the only Java service that calls it.
ai-service.url=${AI_SERVICE_URL:http://localhost:8000}
