server.port=9090
spring.application.name=math-wise-backend

# ----- Database -----
# Every value is overridable via env var. Defaults match the local docker-compose
# setup, so the app runs out of the box without any environment configuration.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mathwise_db}
spring.datasource.username=${DB_USER:db_user}
spring.datasource.password=${DB_PASSWORD:0}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ----- JWT -----
# The default is intentionally a development-only placeholder. In any non-throwaway
# environment, set JWT_SECRET to a 32+ char random string (e.g. `openssl rand -base64 48`).
jwt.secret=${JWT_SECRET:DEV_ONLY_PLACEHOLDER_REPLACE_VIA_JWT_SECRET_ENV_VAR}

# ----- AI service (FastAPI) -----
ai-service.url=${AI_SERVICE_URL:http://localhost:8000}
