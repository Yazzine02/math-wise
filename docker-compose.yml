# Values come from a local `.env` file in this directory. The `${VAR:-default}`
# syntax provides safe fallbacks so `docker compose up` works out of the box
# without configuration. See `.env.example` for the full list of variables.
version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: mathwise-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-db_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-0}
      POSTGRES_DB: ${DB_NAME:-mathwise_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - mathwise-pg-data:/var/lib/postgresql/data
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    container_name: mathwise-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@mathwise.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      - postgres
    restart: unless-stopped

  ollama:
    image: ollama/ollama
    container_name: mathwise-ollama
    ports:
      - "11434:11434"
    volumes:
      - mathwise-ollama-data:/root/.ollama
    restart: unless-stopped

  ai-service:
    build:
      context: ./ai-python
    container_name: mathwise-ai
    environment:
      AI_MODE: ${AI_MODE:-local}
      MODEL_URL: ${MODEL_URL:-http://ollama:11434}
      MODEL_NAME: ${MODEL_NAME:-llama3.2:3b}
    ports:
      - "8000:8000"
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  mathwise-pg-data:
  mathwise-ollama-data:
