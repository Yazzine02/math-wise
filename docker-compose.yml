# Values come from a local `.env` file in this directory. The `${VAR:-default}`
# syntax provides safe fallbacks so `docker compose up` works out of the box
# without configuration. See `.env.example` for the full list of variables.
version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: mathwise-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-db_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-0}
      POSTGRES_DB: ${DB_NAME:-mathwise_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - mathwise-pg-data:/var/lib/postgresql/data
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    container_name: mathwise-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@mathwise.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      - postgres
    restart: unless-stopped

  ollama:
    image: ollama/ollama
    container_name: mathwise-ollama
    ports:
      - "11434:11434"
    volumes:
      - mathwise-ollama-data:/root/.ollama
    restart: unless-stopped

  ai-service:
    build:
      context: ./ai-python
    container_name: mathwise-ai
    environment:
      AI_MODE: ${AI_MODE:-local}
      MODEL_URL: ${MODEL_URL:-http://ollama:11434}
      MODEL_NAME: ${MODEL_NAME:-llama3.2:3b}
    ports:
      - "8000:8000"
    depends_on:
      - ollama
    restart: unless-stopped

  # ── Phase 12: the Java microservices ────────────────────────────────────
  # All four build from the reactor root (backend-springboot/) so the shared
  # `common` module is visible. Only the gateway publishes a host port —
  # the services are internal, reachable by compose DNS name.

  auth-service:
    build:
      context: ./backend-springboot
      dockerfile: auth-service/Dockerfile
    container_name: mathwise-auth
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-mathwise_db}
      DB_USER: ${DB_USER:-db_user}
      DB_PASSWORD: ${DB_PASSWORD:-0}
      JWT_SECRET: ${JWT_SECRET:-DEV_ONLY_PLACEHOLDER_REPLACE_VIA_JWT_SECRET_ENV_VAR}
    depends_on:
      - postgres
    restart: unless-stopped

  content-service:
    build:
      context: ./backend-springboot
      dockerfile: content-service/Dockerfile
    container_name: mathwise-content
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-mathwise_db}
      DB_USER: ${DB_USER:-db_user}
      DB_PASSWORD: ${DB_PASSWORD:-0}
      JWT_SECRET: ${JWT_SECRET:-DEV_ONLY_PLACEHOLDER_REPLACE_VIA_JWT_SECRET_ENV_VAR}
    depends_on:
      - postgres
    restart: unless-stopped

  practice-service:
    build:
      context: ./backend-springboot
      dockerfile: practice-service/Dockerfile
    container_name: mathwise-practice
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-mathwise_db}
      DB_USER: ${DB_USER:-db_user}
      DB_PASSWORD: ${DB_PASSWORD:-0}
      JWT_SECRET: ${JWT_SECRET:-DEV_ONLY_PLACEHOLDER_REPLACE_VIA_JWT_SECRET_ENV_VAR}
      AI_SERVICE_URL: http://ai-service:8000
    depends_on:
      - postgres
      - ai-service
    restart: unless-stopped

  gateway:
    build:
      context: ./backend-springboot
      dockerfile: gateway/Dockerfile
    container_name: mathwise-gateway
    environment:
      AUTH_SERVICE_URL: http://auth-service:9091
      CONTENT_SERVICE_URL: http://content-service:9092
      PRACTICE_SERVICE_URL: http://practice-service:9093
    ports:
      # The monolith's old port — the Flutter app keeps hitting 10.0.2.2:9090.
      - "9090:9090"
    depends_on:
      - auth-service
      - content-service
      - practice-service
    restart: unless-stopped

volumes:
  mathwise-pg-data:
  mathwise-ollama-data:
